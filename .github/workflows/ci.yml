name: CI/CD

permissions:
  contents: read

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  build_test_pack:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0@sha256:548d93f8a18a1acbe6cc127bc4f47281430d34a9e35c18afa80a8d6741c2adc3

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    # As part of running build in a container LibGit2SharpException: repository path ... is not owned by current user
    - name: Fix Git ownership
      run: git config --global --add safe.directory "*"

    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@a94a3b62ee018ef5346cb08fd0d63d93811fe691
      with:
        versionSpec: '6.0.x'

    - name: Determine Generated Version Number
      id: version_step
      uses: gittools/actions/gitversion/execute@a94a3b62ee018ef5346cb08fd0d63d93811fe691

    - name: Debug GitVersion Output
      run: |
        echo "FullSemVer: ${{ steps.version_step.outputs.fullSemVer }}"
        echo "SemVer: ${{ steps.version_step.outputs.semVer }}"
        echo "Major: ${{ steps.version_step.outputs.major }}"
        echo "Minor: ${{ steps.version_step.outputs.minor }}"
        echo "Patch: ${{ steps.version_step.outputs.patch }}"

    - name: Set Version Variables for Build
      run: |
        echo "VERSION=${{ steps.version_step.outputs.semVer }}" >> $GITHUB_ENV
        echo "VERSION_MAJOR=${{ steps.version_step.outputs.major }}" >> $GITHUB_ENV
        echo "VERSION_MINOR=${{ steps.version_step.outputs.minor }}" >> $GITHUB_ENV
        echo "VERSION_PATCH=${{ steps.version_step.outputs.patch }}" >> $GITHUB_ENV

    - name: Restore Dependencies
      run: dotnet restore --configfile NuGet.config
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITHUB_USERNAME: DFE-Digital

    - name: .NET Tool restore
      run: dotnet tool restore

    - name: Build with Semantic Versioning
      run: dotnet build --configuration Release /p:Version=${{ env.VERSION }} /p:AssemblyVersion=${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.0.0 /p:FileVersion=${{ env.VERSION_MAJOR }}.${{ env.VERSION_MINOR }}.${{ env.VERSION_PATCH }}.0 /p:InformationalVersion=${{ env.VERSION }}

    - name: Run .NET Tests with coverage
      run: |
        dotnet test \
          --verbosity normal \
          --report-xunit-trx \
          --coverage \
          --coverage-output coverage.cobertura.xml \
          --coverage-output-format cobertura \
          --coverage-settings coverage.runsettings

      #  dotnet tool run dotnet-coverage collect "dotnet test --verbosity normal --report-xunit-trx" \
      #    -f cobertura \
      #    -o coverage.cobertura.xml \
      #    -s coverage.runsettings \
      #    -ll Verbose

    - name: Convert coverage to SonarQube format
      run: |
        dotnet tool run reportgenerator \
          -reports:**/TestResults/coverage.cobertura.xml \
          -targetdir:coverage-sonar \
          -reporttypes:SonarQube \
          -sourcedirs:.
    
    - name: Upload Sonar coverage report
      uses: actions/upload-artifact@v7
      with:
        name: sonar-coverage-report
        path: coverage-sonar/SonarQube.xml

    - name: SonarCloud scan
      if: github.actor != 'dependabot[bot]'
      uses: DFE-Digital/github-actions/sonarscan-dotnet@fb860bd4a4ec0741de4858926f9379f50d542ff8
      with:
          sonarcloud-project-key: DFE-Digital_education-provider-registry-core
          sonarcloud-token: ${{ secrets.SONAR_TOKEN }}
          use-global-json: true
          coverage-report-path: coverage-sonar/SonarQube.xml

    - name: Run verify format
      run: dotnet format --verbosity=detailed --verify-no-changes

    - name: Pack NuGet Package with SemVer
      run: dotnet pack --configuration Release --output ./nupkg /p:PackageVersion=${{ env.VERSION }}

    - name: Upload NuGet Package Artifact
      uses: actions/upload-artifact@v7
      with:
        name: nupkg
        path: ./nupkg/*.nupkg

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build_test_pack
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download NuGet Package
      uses: actions/download-artifact@v8
      with:
        name: nupkg
        path: ./nupkg

    - name: Publish to GitHub Packages
      env:
        NUGET_API_KEY: ${{ secrets.GITHUB_TOKEN }}
      run: dotnet nuget push ./nupkg/*.nupkg --api-key $NUGET_API_KEY --source "https://nuget.pkg.github.com/DFE-Digital/index.json"
